name: 仓库保活
on:
  schedule:
    # 每 30 天运行一次，避免仓库长期无活动导致 Actions 被自动禁用
    - cron: '0 0 */30 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 更新保活时间戳
        run: |
          mkdir -p .github
          cat > .github/KEEPALIVE.md << EOF
          # Repository Keepalive

          This file is automatically updated to keep the repository active.

          **Last Update:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          **Workflow Run:** #${{ github.run_number }}
          **Trigger:** ${{ github.event_name }}

          ---
          *Auto-generated by [keepalive workflow](.github/workflows/keepalive.yml)*
          EOF

      - name: 提交并推送
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/KEEPALIVE.md
          if git diff --staged --quiet; then
            echo "无变更，无需提交"
          else
            git commit -m "chore: keepalive at $(date -u +'%Y-%m-%d')"
            git push
            echo "保活提交成功"
          fi
